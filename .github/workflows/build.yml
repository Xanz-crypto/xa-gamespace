name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq XAGameSpace.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
        working-directory: XAGameSpace
      - uses: actions/upload-artifact@v4
        with:
          name: XAGameSpace-debug
          path: XAGameSpace/app/build/outputs/apk/debug/*.apk
